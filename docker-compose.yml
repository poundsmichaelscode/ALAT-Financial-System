services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      - mongo
      - redis
    ports:
      - "5050:5050"
    volumes:
      - ./apps/api:/app
      - /app/node_modules

volumes:
  mongo_data:
